name: CI

on:
  push:
  pull_request:

jobs:
  transit-core:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path packages/transit-core

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test --prefix services/api
